    authors: ["James Chang"]
    type: "paper"
    location: "I3-334/paper/i3-334.pdf in this repository"
    relationship: "formalizes"
  - title: "The gap between I3 and the wholeness axiom"
    authors: ["Paul Corazza"]
    location: "https://doi.org/10.4064/fm179-1-4"
    relationship: "background"
  - title: "On the Two Short Axiomatizations of Ortholattices"
    authors: ["Wioletta Truszkowska", "Adam Grabowski"]
    location: "https://mizar.uwb.edu.pl/JFM/Vol15/robbins2.html"
    relationship: "background"

