version: "v0.4"

project:
  name: "I3-334 conditional independence from ZFC + I3"
  description: >-
    Lean formalization of a literal 334-state Turing machine, its external
    consistency equivalence, and conditional independence from ZFC + I3.
  authors: ["James Chang"]
  responsible_maintainers: ["James Chang"]
  license: "MIT"

classification:
  arxiv: ["math.LO", "cs.LO"]
  msc2020: ["03F30", "03D10"]

sources:
