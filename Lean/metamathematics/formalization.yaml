version: "v0.4"

project:
  name: "Nonhalting and PA-independence for a 211-state Turing machine"
  description: >-
    A literal binary Turing machine with 211 working states and 422 transitions
    runs forever from state 0 on an all-zero tape. Neither the arithmetic
    sentence asserting that it does not halt nor the negation of that sentence
    is provable in ordinary first-order Peano arithmetic. The statement uses
    first-order consequence over PA models, which the Solution proves equivalent
    to syntactic provability for the exact arithmetized sentence. The two-sided
    result uses the standard model of PA in Lean's metatheory. The machine is
    given explicitly, and no minimality claim is made.
  authors: ["James Chang"]
  license: "MIT"
  responsible_maintainers: ["James Chang"]

classification:
  arxiv: ["math.LO", "cs.LO"]
  msc2020: ["03D10", "03F30"]

sources:
