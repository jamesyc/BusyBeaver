# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Conditional ZF-independence of the exact 192-state machine"
  description: >-
    A binary 192-state machine with a contextual scanner that, under consistency of first-order ZF,
    runs forever and has no ZF proof of its nonhalting. Arithmetic
    Sigma-1 soundness implies unprovability in both directions. The halting
    sentence expresses the literal machine's behavior in every ZF model.
  authors: ["James Chang"]
  responsible_maintainers: ["James Chang"]
  license: "MIT"

classification:
  arxiv: ["math.LO", "cs.LO"]
  msc2020: ["03F30", "03D10"]

sources:
  - title: "Conditional ZF-independence of a 192-state Turing machine"
    authors: ["James Chang"]
    type: paper
    location: "ZF192/paper/zf192.pdf in this repository"
    relationship: formalizes
  - title: "Nonhalting and ZF-independence for a 207-state Turing machine"
    authors: ["James Chang"]
    type: paper
    id: "https://github.com/jamesyc/BusyBeaver/blob/9437ef874e1c76a0ec45330554e895157d56c604/ZF207/paper/zf207.pdf"
    relationship: background
  - title: "Nonhalting and ZF-independence for a 209-state Turing machine"
    authors: ["James Chang"]
    type: paper
    id: "https://github.com/jamesyc/BusyBeaver/blob/286324f9ad106bbeab32b70404e7a82be2cd660d/ZF209/paper/zf209.pdf"
    relationship: background
  - title: "K230: a 230-state Turing machine for the consistency of ZFC"
    authors: ["Elliot Glazer"]
    id: "https://github.com/elliotglazer/k230-rocq/tree/3142e4dd980f0be12f4abb636c4ae2528afc17eb"
    relationship: background
    note: "Starting machine for the fresh SAT search that produced the ZF192 table."

related_formalizations:
  - id: "https://github.com/jamesyc/BusyBeaver/tree/9437ef874e1c76a0ec45330554e895157d56c604/ZF207"
    relationship: other
    note: >-
      Comparable Lean result for a different literal table. ZF192 uses a separate
      machine construction, with its own startup and simulation proofs.
  - id: "https://github.com/jamesyc/BusyBeaver/tree/286324f9ad106bbeab32b70404e7a82be2cd660d/ZF209"
    relationship: other
    note: >-
      Comparable Lean result using arithmetic calibration. ZF192 proves the
      corresponding claim for its own table via a contextual decoder and a
      checked correspondence of the register programs.

status:
  scope: >-
    The exact literal machine's conditional nonhalting and ZF-independence.
    The proof uses standard-tape halting equivalence with the source and an
    internal implication from source-calculus refutations to physical halting.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

automation:
  methods:
    - method: agent
      framework: "ChatGPT"
    - method: agent
      framework: "Codex"

review:
  status: "self-assessed"
  notes: "Hosted Palomar verification is pending."

alignment:
  namespace: "PalomarZF192"
  statements:
    - source: "Conditional ZF-independence of blank-tape halting."
      lean: "PalomarZF192.exact192Claim"
      module: "ZF192.Solution"
      status: "proved"
    - source: "Blank-tape nonhalting under consistency of ZF."
      lean: "PalomarZF192.nonhalting_of_consistent"
      module: "ZF192.Solution"
      status: "proved"
