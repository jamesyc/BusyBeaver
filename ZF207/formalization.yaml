# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Conditional ZF-independence of the exact 207-state machine"
  description: >-
    A sentence represents blank-tape halting of the 207-state machine in
    every ZF model. If ZF is consistent, it cannot prove nonhalting. If ZF
    is arithmetically Sigma1-sound, it can prove neither halting nor nonhalting.
  authors: ["James Chang"]
  responsible_maintainers: ["James Chang"]
  license: "MIT"

classification:
  arxiv: ["math.LO", "cs.LO"]
  msc2020: ["03F30", "03D10"]

sources:
  - title: "Nonhalting and ZF-independence for a 207-state Turing machine"
    authors: ["James Chang"]
    type: paper
    location: "ZF207/paper/zf207.pdf in this repository"
    relationship: formalizes
  - title: "Nonhalting and ZF-independence for a 209-state Turing machine"
    authors: ["James Chang"]
    type: paper
    location: "ZF209/paper/zf209.pdf in this repository"
    relationship: background
  - title: "K230 Rocq verification"
    authors: ["Elliot Glazer"]
    location: "https://github.com/elliotglazer/k230-rocq"
    relationship: background
  - title: "Busy Beaver developments"
    authors: ["Jeff Ketchersid"]
    location: "https://github.com/jeff87654/busy-beaver"
    relationship: background

